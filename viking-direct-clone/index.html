<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tekstag – Premium Office Solutions</title>

    <!--
      Content Security Policy
      ─────────────────────────────────────────────────────────────────────────
      default-src 'self'          → only load resources from same origin by default
      script-src  'self'          → no inline scripts, no eval()
      style-src   'unsafe-inline' → required by Tailwind JIT + React inline styles
      font-src    fonts.gstatic   → Google Fonts glyphs
      img-src     data: https:    → product/category images from CDN
      connect-src 'self'          → fetch/XHR only to same origin (Vite proxy → Django)
      frame-ancestors 'none'      → prevents clickjacking in any frame
      base-uri    'self'          → prevents <base> tag injection attacks
      form-action 'self'          → form submits only to same origin
      object-src  'none'          → disables Flash/plugins entirely
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none';"
    />

    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Shown until the app's script has loaded; React replaces it. -->
    <div id="root"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font:900 34px 'Arial Black',Arial,sans-serif">tekstag</div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
