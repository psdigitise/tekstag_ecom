# nginx reverse-proxy config for Viking API + Viking Direct frontend
# Place this in /etc/nginx/sites-available/viking and symlink to sites-enabled/

upstream django {
    server 127.0.0.1:8000;
}

# ── Redirect all HTTP → HTTPS ─────────────────────────────────────────────────
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;
    return 301 https://$host$request_uri;
}

# ── HTTPS main server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # SSL — use Let's Encrypt (certbot) to generate these
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options           DENY                                            always;
    add_header X-Content-Type-Options    nosniff                                         always;
    add_header Referrer-Policy           strict-origin-when-cross-origin                 always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none';"
        always;

    # ── Django API ────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 10M;
    }

    # Django admin (obscured URL)
    location /viking-admin-panel/ {
        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 10M;     # product image uploads (default is only 1M)
    }

    # Django static + media
    # "^~" makes these prefixes win over the image/asset regex location at the
    # bottom. Without it, /media/*.png and /static/*.css were looked up in the
    # React dist folder and returned 404.
    location ^~ /static/ {
        alias /path/to/viking-django-api/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /media/ {
        alias /path/to/viking-django-api/media/;
        expires 7d;
        # A location with its own add_header drops the server-level ones, so
        # repeat the one that matters for user-uploaded files.
        add_header X-Content-Type-Options nosniff always;
    }

    # ── React frontend (built files) ──────────────────────────────────────────
    location / {
        root  /path/to/viking-direct-clone/dist;
        index index.html;
        try_files $uri $uri/ /index.html;   # SPA fallback
        expires 1h;
    }

    # Cache hashed assets forever
    location ~* \.(js|css|woff2|png|jpg|svg|ico)$ {
        root    /path/to/viking-direct-clone/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
